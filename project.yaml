# -----------------------------------------------------------------------------
# 分階段範圍
# -----------------------------------------------------------------------------
phases:
  phase1:
    name: 靜態官網 + 內容後台
    status: in_progress
    scope:
      - 官網所有資訊頁（首頁、關於我們、最新消息、課程、須知/辦法、幫孩子鼓掌、聯絡）
      - 補習班人員可透過 CMS 後台更新內容，自動顯示於前台
      - 舊 .php 網址 301 轉址
      - 「線上報名」按鈕連結放在網站設定中，可隨時更換（phase2 前的暫定值待定）
    out_of_scope: [報名系統, 金流, 簡訊]
  phase2:
    name: 報名系統 + 金流
    status: in_progress
    notes: >
      2026-10-02 決定自建：Cloudflare Workers（同一專案）+ D1 資料庫。報名資料（個資）只存 D1，絕不存放在 Git。
      兩個後台：/cms（Sveltia CMS）管課程與上課時段（內容），自建 /admin 管報名資料（Cloudflare Access 以 Email 驗證登入）。
      兩邊以「時段代號」串接；已有報名的時段不可刪除或改代號。
    requirements:
      - 課程介紹與報名：後台可新增課程、編輯內文與圖片；課程頁顯示費用、課程資訊與上課時段（即時剩餘名額）
      - 上課時段：在內容後台 /cms 設定（名稱、時間、名額、費用、時段代號）
      - 報名表欄位：沿用舊系統（學生姓名、家長姓名、學校、年級、手機、Email）＋ 選擇時段、備註
      - 額滿處理：自動列為候補（不產生繳費帳號），由行政手動遞補
      - 繳費：報名時繳全額；每筆報名產生台新虛擬帳號（96989 + 9 碼，3 天期限，依台新規格計算）
      - 自動對帳：接收台新入帳通知（或定時讀對帳檔，視台新提供方式）→ 比對帳號與金額 → 已付費
      - 三竹簡訊：報名成功／繳費帳號／繳費收據（等拿到三竹 API 帳號再接）
      - 報名確認信：寄件人「故事講堂 <service@storykids.com.tw>」；正取（含繳費帳號與期限）、候補（含候補順位）、繳費完成收據。
        寄信服務建議 Brevo（免費每天 300 封）；需在 DNS 設定 SPF / DKIM
      - /admin 報名管理：列表、篩選、改狀態（沿用舊系統 8 種狀態）、匯出 Excel、手動標記合庫轉帳／現金
    blocked_by: [Q12, Q13, Q14, Q15]

# -----------------------------------------------------------------------------
# 已確定的決策
# -----------------------------------------------------------------------------
decisions:
  - id: D1
    topic: 前台框架
    choice: Astro + Tailwind CSS（建置時編譯）
    reason: 輸出純靜態 HTML，速度快、SEO 好；不使用 Tailwind Play CDN（官方標示僅供開發）。
  - id: D2
    topic: 內容存放
    choice: GitHub repo 內的 Markdown / JSON（Astro Content Collections）
    reason: 不需要資料庫；有完整版本紀錄可還原；官網不含任何個資。
  - id: D3
    topic: 內容後台（CMS）
    choice: Sveltia CMS（網頁 public/cms/，設定檔 public/cms/config.yml；GitHub 登入由本專案 Worker 處理 src/worker/cms-auth.ts）
    reason: >
      開源、不依賴第三方伺服器（只依賴 Cloudflare 與 GitHub）；介面支援繁體中文、富文字編輯器有工具列；內容不被綁定。
      2026-10-02 由 Pages CMS 託管版改用：Pages CMS 登入 API 持續逾時（504），GitHub 上也有多筆 2026 年的錯誤回報，穩定性不足。
    tradeoff: 每位編輯者需申請 GitHub 帳號並加為 repo 協作者（GitHub 可能要求開啟兩步驟驗證）
    alternative: 內容管理做進自建 /admin（Email 驗證碼登入、單一後台），工作量較大
  - id: D4
    topic: 部署
    choice: Cloudflare Workers 靜態資源（連 GitHub，push 自動部署；設定檔 wrangler.jsonc）
    notes: >
      Cloudflare 目前的建立流程預設為 Workers（網址 *.workers.dev），功能與 Pages 相同，
      _redirects 一樣有效。wrangler.jsonc 設定 404 頁與不加結尾斜線。
    preview_url: https://storykids-web.c0981985611.workers.dev
    repo: https://github.com/danny900618/storykids_web （暫放開發者個人帳號，之後轉給補習班 / Organization）
  - id: D5
    topic: 網域
    choice: 將 Nameserver 轉到 Cloudflare（註冊商仍留在網路中文）
    reason: 根網域（storykids.com.tw）綁 Cloudflare Pages 必須使用 Cloudflare Nameserver；CNAME 只適用於子網域。
    caution: 轉移前務必完整複製 MX / SPF / DKIM 等郵件相關 DNS 紀錄。
  - id: D6
    topic: 網站形式
    choice: 多頁式（每則消息、每個課程有獨立網址）
    reason: 內容量大（關於我們 6 頁、消息約 50 則），利於 SEO 與分享。
  - id: D7
    topic: 帳號所有權
    choice: >
      GitHub（danny900618）與 Cloudflare（c0981985611@gmail.com）由開發者持有與維護；
      網域 storykids.com.tw 的註冊（網路中文）應過戶到補習班名下（目前註冊人為魔瓶視覺設計，見 Q2）。
    reason: 2026-10-02 開發者決定自行維護（原規劃為補習班持有、開發者為協作者）。網域留在補習班，確保必要時可自行改指向。
    handover: >
      交接時：GitHub repo 用 Transfer ownership 轉移；Cloudflare 無跨帳號搬移功能，需在新帳號重建 Worker 與 D1、
      以 `wrangler d1 export` 匯出／匯入報名資料（需暫停報名）、重設 secrets 與 Access、網域 zone 重新加入（可能需更換 Nameserver）。
  - id: D8
    topic: 系統切分
    choice: 公開內容存 Git（/cms 編輯）；報名個資只存 Cloudflare D1，由同一個 Worker 的 /api、/admin 處理
    reason: 靜態網頁不經過後端（流量免費、不受後端影響）；個資不進 Git；兩者以時段代號串接。
    updated: 2026-10-02（原為「報名系統完全外部化」，改為自建）
  - id: D9
    topic: 流量統計
    choice: Cloudflare Web Analytics（免 cookie），如補習班需要可再加 GA4
  - id: D10
    topic: 三竹簡訊固定 IP
    choice: >
      自建輕量轉發主機（AWS，Caddy 反向代理，只轉發 POST /api/mtk/SmSend、需 X-Relay-Key 密鑰、自動 HTTPS 與安全更新），
      Worker 經 sms-relay.storykids.com.tw 發送。三竹 2026-10-13 回覆需「台灣固定 IP」→ AWS EC2 台北（ap-east-2，約 US$8／月）；
      若三竹主管同意國外固定 IP，可改 Lightsail 東京（約 US$5／月）。設定與步驟在 relay/
    rejected: 換簡訊商（使用者希望續用三竹）、Cloudflare 專屬出口 IP（企業方案）

