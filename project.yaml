# -----------------------------------------------------------------------------
# 分階段範圍
# -----------------------------------------------------------------------------
phases:
  phase1:
    name: 靜態官網 + 內容後台
    status: in_progress
    scope:
      - 官網所有資訊頁（首頁、關於我們、最新消息、課程、須知/辦法、幫孩子鼓掌、聯絡）
      - 補習班人員可透過 CMS 後台更新內容，自動顯示於前台
      - 舊 .php 網址 301 轉址
      - 「線上報名」按鈕連結放在網站設定中，可隨時更換（phase2 前的暫定值待定）
    out_of_scope: [報名系統, 金流, 簡訊]
  phase2:
    name: 報名系統 + 金流
    status: on_hold
    notes: >
      需求盤點完成後再決定。候選：金流平台/開店平台/報名平台（SaaS，零後端）、
      Google 表單+試算表（過渡）、或自建小後端（Cloudflare Workers + D1 /
      SurveyCake Webhook + 台新虛擬帳號）。報名資料（個資）絕不存放在 Git。

# -----------------------------------------------------------------------------
# 已確定的決策
# -----------------------------------------------------------------------------
decisions:
  - id: D1
    topic: 前台框架
    choice: Astro + Tailwind CSS（建置時編譯）
    reason: 輸出純靜態 HTML，速度快、SEO 好；不使用 Tailwind Play CDN（官方標示僅供開發）。
  - id: D2
    topic: 內容存放
    choice: GitHub repo 內的 Markdown / JSON（Astro Content Collections）
    reason: 不需要資料庫；有完整版本紀錄可還原；官網不含任何個資。
  - id: D3
    topic: 內容後台（CMS）
    choice: Pages CMS（託管版，設定檔 .pages.yml）
    reason: 補習班人員以 Email 受邀即可編輯，不需 GitHub 帳號；只能改內容/媒體，改不到程式與設定；開源、內容不被綁定。
    alternative: Sveltia CMS（需 GitHub 帳號 + Cloudflare Worker OAuth）
  - id: D4
    topic: 部署
    choice: Cloudflare Pages（連 GitHub，push 自動部署）
  - id: D5
    topic: 網域
    choice: 將 Nameserver 轉到 Cloudflare（註冊商仍留在遠振）
    reason: 根網域（storykids.com.tw）綁 Cloudflare Pages 必須使用 Cloudflare Nameserver；CNAME 只適用於子網域。
    caution: 轉移前務必完整複製 MX / SPF / DKIM 等郵件相關 DNS 紀錄。
  - id: D6
    topic: 網站形式
    choice: 多頁式（每則消息、每個課程有獨立網址）
    reason: 內容量大（關於我們 6 頁、消息約 50 則），利於 SEO 與分享。
  - id: D7
    topic: 帳號所有權
    choice: GitHub / Cloudflare / 網域 / Analytics 皆以補習班 Email 開設，開發者為協作者
    reason: 避免開發者成為下一個不透明外包。
  - id: D8
    topic: 系統切分
    choice: 官網（公開內容，Git）與報名系統（個資，獨立系統）完全分離，僅以「報名按鈕連結」相接
    reason: 官網被入侵也無個資外洩；報名方案更換時官網不用改。
  - id: D9
    topic: 流量統計
    choice: Cloudflare Web Analytics（免 cookie），如補習班需要可再加 GA4

