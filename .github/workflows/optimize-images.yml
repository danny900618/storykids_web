# 自動縮圖：後台上傳的圖片（常是手機原圖 3～5MB）推上 GitHub 後，
# 自動縮到最長邊 1920px、JPEG 品質 82，並移除 EXIF（含 GPS 位置等隱私資訊），
# 再 commit 回 repo。避免 repo 越來越大、網站載入變慢。
name: 自動縮圖

on:
  push:
    branches: [main]
    paths:
      - 'public/images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-images
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 安裝 ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick

      - name: 縮圖（只處理這次新增或修改的圖片）
        run: |
          # 手動執行（workflow_dispatch）時處理全部圖片；push 時只處理變更的圖片
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            files=$(find public/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \))
          else
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- public/images | grep -iE '\.(jpe?g|png|webp)$' || true)
          fi
          for f in $files; do
            [ -f "$f" ] || continue
            before=$(stat -c%s "$f")
            # 「>」表示只縮小、不放大；-auto-orient 依手機拍攝方向轉正
            mogrify -auto-orient -resize '1920x1920>' -strip -quality 82 "$f"
            after=$(stat -c%s "$f")
            # 若處理後反而變大（原圖已經很小），就還原
            if [ "$after" -ge "$before" ]; then git checkout -- "$f"; fi
          done

      - name: Commit 縮好的圖片
        run: |
          if git diff --quiet; then
            echo "沒有需要縮的圖片"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "自動縮圖"
          git push
