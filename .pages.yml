# Pages CMS 後台設定（https://pagescms.org）
# 補習班人員在後台看到的欄位都定義在這裡。
# 修改欄位時，請同步更新 src/content.config.ts（欄位名稱必須一致）。

media:
  - name: images
    label: 圖片
    input: public/images
    output: /images
    categories: [image]
  - name: files
    label: 檔案（PDF）
    input: public/files
    output: /files
    categories: [document]

content:
  # ---------------------------------------------------------------- 最新消息
  - name: news
    label: 最新消息
    type: collection
    path: src/content/news
    # 中文標題無法轉成網址，所以檔名用建立時間
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, date, featured, published]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: date
        label: 日期
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: featured
        label: 顯示在首頁（會出現在首頁最上方的輪播）
        type: boolean
        default: false
      - name: published
        label: 啟用（取消勾選可當草稿，不會出現在網站上）
        type: boolean
        default: true
      - name: cover
        label: 封面圖片
        type: image
        options:
          media: images
      - name: slide_image
        label: 首頁輪播圖片（選填，建議橫幅 1500×730；未上傳則使用封面圖片）
        type: image
        options:
          media: images
      - name: summary
        label: 摘要（選填，列表卡片上顯示；未填寫會自動擷取內文開頭）
        type: text
      - name: body
        label: 內文
        type: rich-text

  # ---------------------------------------------------------------- 課程介紹
  - name: courses
    label: 課程介紹
    type: collection
    path: src/content/courses
    filename: "course-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, category, featured, published, order]
      primary: title
      sort: [order, title]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 課程名稱
        type: string
        required: true
      - name: category
        label: 班別（例如：學期班（11509學期）、寒假營隊）
        type: string
        default: 學期班
      - name: audience
        label: 適合對象（例如：小一~小二）
        type: string
      - name: summary
        label: 課程簡介（顯示在課程卡片上）
        type: text
      - name: schedule
        label: 上課時間
        type: string
      - name: class_size
        label: 班級人數
        type: string
      - name: price
        label: 費用
        type: string
      - name: cover
        label: 課程卡片圖片
        type: image
        options:
          media: images
      - name: featured
        label: 顯示在首頁
        type: boolean
        default: false
      - name: published
        label: 啟用
        type: boolean
        default: true
      - name: order
        label: 排序（數字越小越前面）
        type: number
        default: 100
      - name: registration_url
        label: 報名連結（選填；未填寫則使用「網站設定」的報名連結）
        type: string
      - name: body
        label: 課程詳細內容
        type: rich-text

  # ---------------------------------------------------------------- 關於講堂 / 上課須知
  - name: pages
    label: 關於講堂、上課須知
    type: collection
    path: src/content/pages
    filename: "page-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, section, order, published]
      primary: title
      sort: [section, order]
      default:
        sort: order
        order: asc
    fields:
      - name: title
        label: 頁面標題
        type: string
        required: true
      - name: section
        label: 放在哪個選單
        type: select
        required: true
        default: about
        options:
          values:
            - value: about
              label: 關於講堂
            - value: info
              label: 上課須知
      - name: order
        label: 排序（數字越小越前面）
        type: number
        default: 100
      - name: description
        label: 簡介（選填，顯示在目錄卡片與首頁）
        type: text
      - name: cover
        label: 首頁圖片（選填，只有排序第一的「關於講堂」頁面會顯示在首頁）
        type: image
        options:
          media: images
      - name: published
        label: 啟用
        type: boolean
        default: true
      - name: body
        label: 內文
        type: rich-text

  # ---------------------------------------------------------------- 講堂老師
  - name: teachers
    label: 講堂老師
    type: collection
    path: src/content/teachers
    filename: "teacher-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [name, role, category, order, published]
      primary: name
      sort: [order, name]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: 老師名字（例如：將軍，網站會自動加上「老師」）
        type: string
        required: true
      - name: role
        label: 職稱（例如：班主任、指導老師）
        type: string
      - name: category
        label: 分類標籤（顯示在卡片上方，例如：課程總監、口語表達）
        type: string
      - name: major
        label: 學歷（例如：中興大學 教育研究所）
        type: string
      - name: photo
        label: 照片（選填）
        type: image
        options:
          media: images
      - name: order
        label: 排序（數字越小越前面）
        type: number
        default: 100
      - name: published
        label: 啟用
        type: boolean
        default: true
      - name: body
        label: 老師簡介
        type: rich-text

  # ---------------------------------------------------------------- 幫孩子鼓掌
  - name: gallery
    label: 幫孩子鼓掌（相簿／影片）
    type: collection
    path: src/content/gallery
    filename: "album-{year}{month}{day}-{hour}{minute}{second}.md"
    view:
      fields: [title, subtitle, date, order, published]
      primary: title
    fields:
      - name: title
        label: 標題
        type: string
        required: true
      - name: subtitle
        label: 副標題（例如：閩南語演說、一對一課程）
        type: string
      - name: summary
        label: 簡短描述（列表上顯示；未填寫會自動擷取說明文字開頭）
        type: text
      - name: date
        label: 日期（有日期的會排在最前面，新到舊）
        type: date
        options:
          format: yyyy-MM-dd
      - name: cover
        label: 封面圖片
        type: image
        options:
          media: images
      - name: images
        label: 相簿照片（可一次選多張）
        type: image
        options:
          media: images
          multiple: true
      - name: youtube
        label: YouTube 影片網址（選填；只填影片、不放照片時，會顯示在頁面最上方）
        type: string
      - name: published
        label: 啟用
        type: boolean
        default: true
      - name: order
        label: 排序（沒有日期的項目才會用到，數字越小越前面）
        type: number
        default: 100
      - name: body
        label: 說明文字
        type: rich-text

  # ---------------------------------------------------------------- 網站設定
  - name: site
    label: 網站設定
    type: file
    path: src/content/site.json
    format: json
    fields:
      - name: name
        label: 網站名稱
        type: string
        required: true
      - name: full_name
        label: 立案全名
        type: string
      - name: slogan
        label: 標語（首頁大標下方）
        type: string
      - name: description
        label: 網站介紹（首頁與 Google 搜尋結果顯示）
        type: text
      - name: logo
        label: Logo
        type: image
        options:
          media: images
      - name: hero_image
        label: 首頁主視覺圖片（建議橫式、寬 1600px 以上）
        type: image
        options:
          media: images
      - name: phone
        label: 電話
        type: string
      - name: fax
        label: 傳真
        type: string
      - name: address
        label: 地址
        type: string
      - name: address_note
        label: 地址補充（例如：文心森林公園旁）
        type: string
      - name: map_url
        label: Google 地圖連結（選填；未填寫會用地址自動產生）
        type: string
      - name: hours
        label: 服務時間（可換行）
        type: text
      - name: email
        label: Email
        type: string
      - name: line_url
        label: LINE 官方帳號連結
        type: string
      - name: facebook_url
        label: Facebook 粉絲專頁連結
        type: string
      - name: registration_url
        label: 線上報名連結（未填寫時，報名按鈕會連到 LINE）
        type: string
      - name: registration_label
        label: 報名按鈕文字
        type: string
        default: 線上報名
